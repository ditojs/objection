# better-sqlite3 and sqlite3 download or build their native modules. esbuild's
# script only checks its binary, which comes from an optional dependency anyway.
allowBuilds:
  better-sqlite3: true
  esbuild: false
  sqlite3: true
# Was newer than pnpm's minimum release age when the lockfile was created.
minimumReleaseAgeExclude:
  - tedious@20.3.7
