name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [16.x, 18.x, 20.x, 22.x, 24.x]
        knex: [default]
        # Also test the oldest supported knex version, as a separate job.
        include:
          - node-version: 16.x
            knex: 2.3.0

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Install knex ${{ matrix.knex }}
        if: matrix.knex != 'default'
        run: npm install --no-save knex@${{ matrix.knex }}

      - name: Start test databases
        run: |
          # Retry the pull, public.ecr.aws rate limits anonymous pulls.
          for i in 1 2 3 4 5; do
            docker compose pull && break
            sleep $((i * 15))
          done
          npm run db:up

      - name: Run tests
        if: matrix.knex == 'default'
        run: npm test

      # The typings of older knex versions don't compile with current
      # TypeScript, so only the test suite runs against them.
      - name: Run tests without typings
        if: matrix.knex != 'default'
        run: npx mocha --slow 10 --timeout 15000 --reporter spec --recursive tests --exclude "tests/unit/relations/files/**"
