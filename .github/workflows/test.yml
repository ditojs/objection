name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20.19.0 is the oldest supported version, the first one that can
        # require() ES modules without a flag.
        node-version: [20.19.0, 20.x, 22.x, 24.x]
        mysql: ['8.4']
        # Also test MySQL 5.7, as a separate job.
        include:
          - node-version: 24.x
            mysql: '5.7'

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      # The generated parsers have to match their grammars. One job is enough.
      - name: Check the generated parsers
        if: matrix.node-version == '24.x' && matrix.mysql == '8.4'
        run: |
          npm run build:parsers
          git diff --exit-code lib/queryBuilder/parsers

      - name: Start test databases
        env:
          COMPOSE_FILE: ${{ matrix.mysql == '5.7' && 'docker-compose.yml:docker-compose.mysql57.yml' || 'docker-compose.yml' }}
          # The MySQL 5.7 job only needs MySQL, all services start otherwise.
          SERVICES: ${{ matrix.mysql == '5.7' && 'mysql' || '' }}
        run: |
          # Retry the pull, public.ecr.aws rate limits anonymous pulls.
          for i in 1 2 3 4 5; do
            docker compose pull $SERVICES && break
            sleep $((i * 15))
          done
          npm run db:up -- $SERVICES

      - name: Run tests
        if: matrix.mysql != '5.7'
        run: npm test

      # The MySQL 5.7 job only runs the MySQL tests, the other jobs already lint
      # and check typings.
      - name: Run the MySQL tests
        if: matrix.mysql == '5.7'
        env:
          DATABASES: mysql
        run: npx vitest run
