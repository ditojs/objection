name: Docs

# The docs describe the published package, so they deploy with the releases:
# version tags without a prerelease part. Docs fixes between releases deploy
# through a manual run on main.
on:
  push:
    tags: ['v*', '!v*-*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Native modules (sqlite3) aren't needed to build the docs.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm docs:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: doc/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
